# Publishes crewai-pastdotdev to PyPI when a version tag (v*) is pushed.
# PyPI trusts this workflow through Trusted Publishing, so no token or secret
# is stored here: PyPI accepts the upload from
# pastdotdev/crewai-pastdotdev, workflow publish.yml, with no environment.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag is the package version
        run: |
          version=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/crewai_pastdotdev/_version.py').read()).group(1))")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in _version.py."
            exit 1
          fi

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: Build and check the distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
